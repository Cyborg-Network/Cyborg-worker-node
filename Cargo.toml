[workspace]
members = [
	"miner",
	"neuro-zk-runtime",
	"open-inference-runtime",
  "cycloud-runtime",
  "cyborg-agent", 
  "types",
]

[workspace.dependencies]
async-stream = { version = "0.3.6" }
async-trait = { git = "https://github.com/dtolnay/async-trait.git" }
futures = { version = "0.3.28" }
serde = { version = "1.0.197", default-features = false }
serde_json = { version = "1.0.114", default-features = false }
subxt = { version = "0.38" }
subxt-signer = "0.38.0"
tokio = { version = "1.41.0" }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19" }
tracing-appender = { version = "0.2.3" }
reqwest = { version = "0.12.9", features = ["json", "blocking"] }
bollard = { version = "0.19.2" }
sysinfo = { version = "0.32.0" }

miner = { path = "miner" }
cyborg-agent = { path = "cyborg-agent" }
types = { path = "types" }
neuro-zk-runtime = { path = "neuro-zk-runtime" }
open-inference-runtime = { path = "open-inference-runtime" }
flash-infer-runtime = { path = "flash-infer-runtime" }
cycloud-runtime = { path = "cycloud-runtime" }
