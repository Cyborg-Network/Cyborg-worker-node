version: '3.8'

services:
  user-container-template:
    build:
      context: .
      dockerfile: Dockerfile.container
    image: cycloud-user-container:latest
    container_name: cycloud-user-container
    hostname: cycloud
    
    security_opt:
      - no-new-privileges:true
    
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    
    mem_limit: ${MEM_LIMIT}
    memswap_limit: ${MEM_SWAP_LIMIT}
    # CPU shares will onyl become relevant when we start to enable multiple users/containers on the same machine
    # cpu_shares: ${CPU_SHARES}
    cpus: ${CPU_LIMIT}
    pids_limit: ${PIDS_LIMIT}
    
    volumes:
      # Mount API socket for container-access client
      - /var/run/container-access-api.sock:/var/run/container-access-api.sock:ro
      # Mount client script
      - /opt/container-management:/usr/local/bin/container-access:ro
      # Persistent storage for user data
      - user-home:/root:rw
      - user-workspace:/workspace:rw
      # Temporary directories
      - /tmp
      - /var/tmp

    ports:
      - "${SSH_PORT}:22"
    
    networks:
      - container-network
    
    dns:
      - 8.8.8.8
      - 8.8.4.4
    
    environment:
      - CONTAINER_NAME=${CONTAINER_NAME}
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "container_type,user_id"
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "pgrep", "sshd"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    labels:
      com.cycloud.type: "cycloud-user-container"
      com.cycloud.created: "${CREATED_DATE}"

networks:
  container-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: br-containers
      com.docker.network.bridge.enable_ip_masquerade: "true"

volumes:
  user-${USER_ID}-home:
    driver: local
    labels:
      com.cycloud.volume_type: "home"
  
  user-${USER_ID}-workspace:
    driver: local
    labels:
      com.cycloud.volume_type: "workspace"