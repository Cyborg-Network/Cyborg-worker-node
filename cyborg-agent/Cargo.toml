[package]
name = "cyborg-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
types = { workspace = true }
subxt = { workspace = true }

anyhow = "1.0.57"
async-recursion = "1.0"
base64 = "0.13.0"
futures = "0.3.21"
futures-channel = "0.3.21"
futures-util = "0.3.21"
hex = "0.4.3"
http = "0.2.8"
lazy_static = "1.4.0"
log = "0.4.17"
pkg-version = "1.0.0"
proc-macro2 = "1.0.40"
quote = "1.0.20"
rand = "0.8.5"
once_cell = "1.21.3"
tempfile = "3.23.0"
reqwest = { version = "0.11.11", features = ["json"] }
serde = { version = "1.0.137", features = ["derive"] }
serde_json = "1.0.81"
sha2 = "0.10.2"
syn = "1.0.98"
sysinfo = "0.24.6"
tokio = { version = "1.16.1", features = ["rt", "macros", "rt-multi-thread", "process"] }
tokio-tungstenite = "0.17.1"
toml = "0.5.9"
uuid = { version = "1.1.2", features = ["v4"] }
rustls = "0.23.13"
tokio-rustls = "0.26.0"
x25519-dalek = "2.0.1"
sp-core = "34.0.0"
sp-runtime = "39.0.2"
sodiumoxide = "0.2.7"
zbus = { version = "5.1.1", default-features = false, features = ["tokio"] }
