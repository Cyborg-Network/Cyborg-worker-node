name: Alpha Patch

on:
  push:
    tags:
      - "v0.0.*"

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            use_cross: true
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: ${{ matrix.target }}
          override: true
          components: rust-src

      - name: Install cross (for aarch64)
        if: matrix.use_cross == true
        run: cargo install cross

      - name: Build project
        run: |
          export RUSTFLAGS="-Awarnings"
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }} --release
          fi

      - name: Prepare release archive
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/cyborg-miner release/
          cp scripts/setup.sh release/
          chmod +x release/cyborg-miner release/setup.sh
          tar -czvf cyborg-miner-linux-${{ matrix.arch }}.tar.gz -C release .

      - name: Generate SHA256
        run: |
          sha256sum cyborg-miner-linux-${{ matrix.arch }}.tar.gz > cyborg-miner-linux-${{ matrix.arch }}.tar.gz.sha256
          cat cyborg-miner-linux-${{ matrix.arch }}.tar.gz.sha256

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: | 
            cyborg-miner-linux-${{ matrix.arch }}.tar.gz
            cyborg-miner-linux-${{ matrix.arch }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
